<!DOCTYPE html>
<html class="scroll-smooth h-full" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nesma Madad | Design Catalog</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;0,800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#006876",
          "primary-container": "#008394",
          "surface": "#121212",
          "on-surface": "#fbf9f8",
          "outline": "#6e797c",
          "gold": "#C9A96E"
        },
        fontFamily: {
          "display": ["Montserrat", "Cairo", "sans-serif"],
          "body": ["Inter", "Cairo", "sans-serif"],
          "arabic": ["Cairo", "sans-serif"]
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  [dir="rtl"] { font-family: 'Cairo', sans-serif !important; }
  [dir="rtl"] .font-display, [dir="rtl"] .font-body { font-family: 'Cairo', sans-serif !important; }
  .slide { display: none; }
  .slide.active { display: flex; }
</style>
</head>
<body class="bg-surface font-body text-on-surface h-full overflow-hidden flex flex-col justify-between">

<!-- Top Navigation -->
<nav class="fixed top-0 left-0 w-full z-50 bg-black/60 backdrop-blur-md border-b border-white/10">
  <div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
    <div class="flex items-center gap-4">
      <a href="/index.html" class="flex items-center gap-2">
        <img src="logo-gold-v2.png" alt="Nesma Madad" class="h-10 w-10 object-contain"/>
        <span class="font-display text-sm font-bold text-white tracking-wider uppercase" id="nav-title">Nesma Madad</span>
      </a>
      <span class="text-white/40">|</span>
      <span class="text-gold font-semibold text-xs uppercase tracking-widest" id="catalog-subtitle">Corporate Catalog</span>
    </div>
    
    <div class="flex items-center gap-4">
      <button class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-colors" id="lang-toggle">
        AR
      </button>
      <a href="/index.html" class="bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full flex items-center justify-center transition-colors" aria-label="Close catalog">
        <span class="material-symbols-outlined">close</span>
      </a>
    </div>
  </div>
</nav>

<!-- Carousel Main Viewport -->
<div class="relative flex-1 w-full flex items-center justify-center mt-16 md:mt-0">
  
  <!-- Navigation Arrows -->
  <button onclick="prevSlide()" class="absolute left-4 z-40 bg-black/50 hover:bg-black/80 border border-white/25 hover:border-white/50 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all cursor-pointer">
    <span class="material-symbols-outlined">west</span>
  </button>
  <button onclick="nextSlide()" class="absolute right-4 z-40 bg-black/50 hover:bg-black/80 border border-white/25 hover:border-white/50 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all cursor-pointer">
    <span class="material-symbols-outlined">east</span>
  </button>

  <!-- Slider Wrapper -->
  <div class="w-full h-full" id="slides-container">
    <!-- Slides will be inserted dynamically by JS -->
  </div>

</div>

<!-- Bottom Control & Details Panel -->
<div class="bg-black/80 backdrop-blur-md border-t border-white/10 py-6 px-6 z-40">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    <!-- Left: Page Index -->
    <div class="text-white/60 font-semibold text-sm">
      <span id="current-slide-num" class="text-white text-base">01</span> / <span class="text-white/40">20</span>
    </div>
    
    <!-- Center: Spec Details -->
    <div class="text-center md:text-left flex-1 px-8 max-w-2xl">
      <h2 id="item-title" class="font-display text-xl font-bold text-white mb-1">Corporate Module Desk</h2>
      <p id="item-desc" class="text-xs text-white/70">Solid oak wood top with brushed brass drawer linings and low-VOC matte varnish.</p>
    </div>

    <!-- Right: Action Call -->
    <div class="flex items-center gap-4">
      <a href="/index.html#contact" class="bg-gold text-black hover:bg-white hover:text-black transition-all px-8 py-3 rounded-full text-xs font-bold uppercase tracking-widest">
        <span data-lang="en">Inquire About Spec</span>
        <span data-lang="ar">استفسر عن المواصفات</span>
      </a>
    </div>
  </div>
</div>

      // Generate 15 more placeholder items to make it a total of 20

          "1497366754035-f200968a6e72", "1497215842964-222b430dc094", "1542744094-3a31f103e35f",

  },
  dining: {

        "1554118811-1e0d58224f24", "1501339847302-ac426a4a7cbb", "1495474472287-4d71bcdd2085",
        "1445116572660-236099ec97a0", "1525610553991-2bede1a236e2", "1559925393-8be0ec4767c8",
        "1511920170033-f8396924c348", "1521017432531-fbd92d768814", "1507133750040-4a8f57021571",

      ][i % 15]}?w=1600&q=80`,

      desc: { en: "Durable and stylish dining tables, stools and modular counters designed for high traffic and aesthetic spaces.", ar: "طاولات متينة وأنيقة وكراسي مرتفعة وطاولات خدمة مصممة للمقاهي والمساحات النشطة." }
    }))
  }
};

let currentCategory = "corporate";
let currentIdx = 0;
let currentLang = "en";

// Parse category from URL
const urlParams = new URLSearchParams(window.location.search);
const categoryParam = urlParams.get('category');
if (categoryParam && catalogData[categoryParam]) {
  currentCategory = categoryParam;
}

// Persist language or check localStorage
if (localStorage.getItem('preferredLanguage')) {
  currentLang = localStorage.getItem('preferredLanguage');
} else if (document.documentElement.dir === 'rtl' || navigator.language.startsWith('ar')) {
  currentLang = 'ar';
}

function updateLangUI() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang-toggle').textContent = currentLang === 'ar' ? 'EN' : 'AR';
  
  // Update category title in nav
  document.getElementById('catalog-subtitle').textContent = catalogData[currentCategory].title[currentLang];
  
  // Set current lang display elements
  document.querySelectorAll('[data-lang]').forEach(el => {
    const lang = el.getAttribute('data-lang');
    el.style.display = lang === currentLang ? 'inline' : 'none';
  });

  updateSlideDetails();
}

function initSlider() {
  const container = document.getElementById('slides-container');
  container.innerHTML = '';
  
  const items = catalogData[currentCategory].items;
  items.forEach((item, idx) => {
    const slide = document.createElement('div');
    slide.className = `slide absolute inset-0 w-full h-full justify-center items-center ${idx === currentIdx ? 'active' : ''}`;
    slide.innerHTML = `
      <img src="${item.image}" alt="${item.title[currentLang]}" class="w-full h-full object-cover transition-transform duration-[1200ms] ease-out select-none"/>
      <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
    `;
    container.appendChild(slide);
  });
  
  updateSlideDetails();
}

function updateSlideDetails() {
  const item = catalogData[currentCategory].items[currentIdx];
  document.getElementById('current-slide-num').textContent = String(currentIdx + 1).padStart(2, '0');
  document.getElementById('item-title').textContent = item.title[currentLang];
  document.getElementById('item-desc').textContent = item.desc[currentLang];
}

function nextSlide() {
  const slides = document.querySelectorAll('.slide');
  slides[currentIdx].classList.remove('active');
  currentIdx = (currentIdx + 1) % slides.length;
  slides[currentIdx].classList.add('active');
  updateSlideDetails();
}

function prevSlide() {
  const slides = document.querySelectorAll('.slide');
  slides[currentIdx].classList.remove('active');
  currentIdx = (currentIdx - 1 + slides.length) % slides.length;
  slides[currentIdx].classList.add('active');
  updateSlideDetails();
}

// Keyboards bindings
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    if (currentLang === 'ar') prevSlide(); else nextSlide();
  } else if (e.key === 'ArrowLeft') {
    if (currentLang === 'ar') nextSlide(); else prevSlide();
  } else if (e.key === 'Escape') {
    window.location.href = '/index.html';
  }
});

// Toggle Language
document.getElementById('lang-toggle').addEventListener('click', () => {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('preferredLanguage', currentLang);
  updateLangUI();
});

// Init
updateLangUI();
initSlider();
</script>

</body>
</html>
